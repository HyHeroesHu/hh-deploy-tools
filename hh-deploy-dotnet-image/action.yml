name: "Deploy HH .NET App From Dockerhub image"

description: "Deploying HyHeroes .NET application from dockerhub, via SSH"

inputs:
  image-reference:
    description: "Optional repository@sha256 digest returned by the backend build action."
    required: false
    default: ""
  application-name:
    description: "The full name of the application"
  discord-nofity-webook-url:
    description: "The Discord webhook URL for event notification."
    required: true
  dockerhub-pat:
    description: "DockerHub PAT for pushing images."
    required: true
  dockerhub-user:
    description: "DockerHub user for pushing images."
    required: true
  dockerhub-namespace:
    description: "DockerHub namespace for pushing images."
    required: true
  dockerhub-image-name:
    description: "DockerHub image name. At the end a timestamp will be concated."
    required: true
  docker-container-name:
    description: "The name of the docker container, which will host the app."
    required: true
  docker-container-port:
    description: "The public port, where the docker container's app will be reachable."
    required: true
  version-timestamp:
    description: "Version timestamp value for docker image identifying."
    required: true
  ssh-host:
    description: "SSH host address"
    required: true
  ssh-user:
    description: "SSH user"
    required: true
  ssh-password:
    description: "SSH password"
    required: true
  secret-env-base64:
    description: ".env file content in Base64"
    required: true
  nginx-site-config-path:
    description: "Absolute path to nginx site config on Linux. If false, the app won't be remove from the nginx upstream during the deployment."
    required: false
  volume-mount-for-static-files:
    description: "Mounts a volume with linux file system binding"
    required: false

runs:
  using: "composite"
  steps:
    - name: Get Current Timestamp
      shell: bash
      id: timestampPublishStarted
      run: |
        export TZ="Europe/Budapest"
        echo "timestampPublishStarted=$(date +"%Y. %m. %d. %H:%M:%S")" >> $GITHUB_ENV
  
    - name: Notify Discord
      uses: liondadev/discord-action@v2.1.3
      with:
        # The webhook URL
        webhook-url: ${{ inputs.discord-nofity-webook-url }}
        # The message to send
        message: |
          -----------------------------
          🔃 Application: **${{ inputs.application-name }}**
          🟡 State: **PUBLISH STARTED**
          ⏲️ Timestamp: **${{ env.timestampPublishStarted }}**
          🆔 Run ID: **${{ github.run_id }}**
          👤 Git Actor: **${{ github.actor }}**
          🔗 Run Link: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
    
    - name: Deploy Docker image to VPS via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ inputs.ssh-host }}
        username: ${{ inputs.ssh-user }}
        password: ${{ inputs.ssh-password }}
        script: |
          bash -se <<'HH_DEPLOY_SCRIPT'
          set -Eeuo pipefail
          cd /srv
          exec 9>.hh-deploy.lock
          flock -x 9

          service='${{ inputs.docker-container-name }}'
          nginx_config='${{ inputs.nginx-site-config-path }}'
          port='${{ inputs.docker-container-port }}'
          image_reference='${{ inputs.image-reference }}'
          image_override=''
          expected_image_id=''
          compose_files=()
          nginx_work=''
          nginx_drained=false
          backend_touched=false

          cleanup() {
            local status=$?
            trap - EXIT
            set +e
            if (( status != 0 )); then
              echo "Deployment failed for $service." >&2
              if [[ "$nginx_drained" == true ]]; then
                if [[ "$backend_touched" == true ]]; then
                  sudo cp -p "$nginx_work/drained" "$nginx_config" && sudo nginx -t && sudo nginx -s reload
                  echo "Upstream remains drained. Recover $service manually before restoring nginx traffic. Original config: $nginx_work/original" >&2
                else
                  sudo cp -p "$nginx_work/original" "$nginx_config" && sudo nginx -t && sudo nginx -s reload
                  if (( $? != 0 )); then
                    echo "Could not restore nginx; manual recovery required. Original config: $nginx_work/original" >&2
                  fi
                fi
              fi
            fi
            if [[ -n "$nginx_work" && $status -eq 0 ]]; then
              rm -rf -- "$nginx_work" || echo "Warning: nginx staging cleanup failed." >&2
            fi
            if [[ -n "$image_override" ]]; then
              rm -f -- "$image_override" || echo "Warning: image override cleanup failed." >&2
            fi
            exit "$status"
          }
          trap cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM

          echo "${{ inputs.dockerhub-pat }}" | docker login -u "${{ inputs.dockerhub-user }}" --password-stdin

          if [[ -n "$image_reference" ]]; then
            [[ "$service" =~ ^[a-zA-Z0-9][a-zA-Z0-9_.-]*$ ]]
            [[ "$image_reference" =~ ^[a-z0-9][a-z0-9._/-]*@sha256:[0-9a-f]{64}$ ]]
            expected_repository='${{ inputs.dockerhub-namespace }}/${{ inputs.dockerhub-image-name }}'
            [[ "$image_reference" == "$expected_repository"@sha256:* ]] || {
              echo "Built image repository does not match the deployment inputs." >&2
              exit 1
            }
            [[ -f docker-compose.yml ]] || {
              echo "Expected /srv/docker-compose.yml for digest deployment." >&2
              exit 1
            }
            compose_files=(-f docker-compose.yml)
            if [[ -f docker-compose.override.yml ]]; then
              compose_files+=(-f docker-compose.override.yml)
            elif [[ -f docker-compose.override.yaml ]]; then
              compose_files+=(-f docker-compose.override.yaml)
            fi
            configured_services=$(docker compose "${compose_files[@]}" config --services)
            if ! printf '%s\n' "$configured_services" | awk -v service="$service" '$0 == service { found = 1 } END { exit !found }'; then
              echo "Service $service is absent from the server Compose configuration." >&2
              exit 1
            fi
            image_override=$(mktemp "$PWD/.hh-image-override.XXXXXXXX.yml")
            printf 'services:\n  %s:\n    image: "%s"\n' "$service" "$image_reference" > "$image_override"
            compose_files+=(-f "$image_override")
          fi
          compose() { docker compose "${compose_files[@]}" "$@"; }
          compose pull "$service"
          if [[ -n "$image_reference" ]]; then
            expected_image_id=$(docker image inspect --format '{{.Id}}' "$image_reference")
            [[ -n "$expected_image_id" ]]
            echo "Deploying image: $image_reference; image ID: $expected_image_id"
          fi
          echo "${{ inputs.secret-env-base64 }}" | base64 --decode > .env

          if [[ -n "$nginx_config" ]]; then
            [[ "$port" =~ ^[0-9]+$ ]]
            nginx_config=$(readlink -f -- "$nginx_config")
            nginx_work=$(mktemp -d)
            sudo cp -p "$nginx_config" "$nginx_work/original"
            sudo cat "$nginx_work/original" | awk -v port="$port" '
              BEGIN { pattern = "^[[:space:]]*server[[:space:]]+127\\.0\\.0\\.1:" port "([[:space:]]+[^;#]+)?[[:space:]]*;[[:space:]]*(#.*)?$" }
              $0 ~ pattern {
                matches++
                directive = $0
                sub(/;.*/, "", directive)
                if (directive ~ /[[:space:]]down([[:space:]]|$)/) invalid = 1
                sub(/;/, " down;")
              }
              { print }
              END {
                if (matches != 1 || invalid) {
                  print "Expected exactly one active nginx upstream for port " port > "/dev/stderr"
                  exit 1
                }
              }
            ' > "$nginx_work/drained"
            sudo chmod --reference="$nginx_work/original" "$nginx_work/drained"
            sudo chown --reference="$nginx_work/original" "$nginx_work/drained"
            nginx_drained=true
            sudo cp -p "$nginx_work/drained" "$nginx_config"
            sudo nginx -t
            sudo nginx -s reload
          fi

          backend_touched=true
          compose up -d --no-deps --force-recreate "$service"
          container_id=$(compose ps -aq "$service")
          [[ -n "$container_id" && "$container_id" != *$'\n'* ]]
          if [[ -n "$image_reference" ]]; then
            actual_image_id=$(docker inspect --format '{{.Image}}' "$container_id")
            [[ "$actual_image_id" == "$expected_image_id" ]] || {
              echo "Container image mismatch: expected $expected_image_id, found $actual_image_id." >&2
              exit 1
            }
            docker image inspect --format 'Application revision: {{index .Config.Labels "org.opencontainers.image.revision"}}; Common revision: {{index .Config.Labels "hu.hyheroes.common.revision"}}' "$image_reference"
          fi
          deadline=$((SECONDS + 60))
          stable_since=-1
          ready=false
          while (( SECONDS < deadline )); do
            state=$(docker inspect --format '{{.State.Status}} {{.RestartCount}} {{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}} {{.State.Running}}' "$container_id")
            read -r container_status restart_count health running <<< "$state"
            if [[ "$container_status" == exited || "$container_status" == dead || "$health" == unhealthy || "$restart_count" != 0 ]]; then
              echo "Startup failed for $service: $state" >&2
              exit 1
            fi
            if [[ "$container_status" == running && "$running" == true ]]; then
              if (( stable_since < 0 )); then stable_since=$SECONDS; fi
              if (( SECONDS - stable_since >= 10 )) && [[ "$health" == none || "$health" == healthy ]]; then
                ready=true
                break
              fi
            else
              stable_since=-1
            fi
            sleep 1
          done
          if [[ "$ready" != true ]]; then
            echo "Startup verification timed out for $service." >&2
            exit 1
          fi

          if [[ "$nginx_drained" == true ]]; then
            sudo cp -p "$nginx_work/original" "$nginx_config"
            sudo nginx -t
            sudo nginx -s reload
            nginx_drained=false
          fi

          docker image prune -f || echo "Warning: image pruning failed after successful deployment." >&2
          HH_DEPLOY_SCRIPT

          
    ##
    ## Conditional Discord notifications about finish
    ##
    - name: Get Current Timestamp
      id: timestampPublishSucceeded
      shell: bash
      run: |
        export TZ="Europe/Budapest"
        sudo echo "timestampPublishSucceeded=$(date +"%Y. %m. %d. %H:%M:%S")" >> $GITHUB_ENV
        
    - name: Notify Discord (on Success)
      uses: liondadev/discord-action@v2.1.3
      with:
        # The webhook URL
        webhook-url: ${{ inputs.discord-nofity-webook-url }}
        # The message to send
        message: |
          -----------------------------
          🔃 Application: **${{ inputs.application-name }}**
          🟢 State: **PUBLISH SUCCEEDED**
          ⏲️ Timestamp: **${{ env.timestampPublishSucceeded }}**
          🆔 Run ID: **${{ github.run_id }}**
          👤 Git Actor: **${{ github.actor }}**
          🔗 Run Link: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
    
    - name: Get Current Timestamp
      id: timestampPublishFailed
      shell: bash
      if: failure() # Only runs if there is a failure in previous steps
      run: |
        export TZ="Europe/Budapest"
        sudo echo "timestampPublishFailed=$(date +"%Y. %m. %d. %H:%M:%S")" >> $GITHUB_ENV

    - name: Notify Discord (on Failure)
      uses: liondadev/discord-action@v2.1.3
      if: failure() # Only runs if there is a failure in previous steps
      with:
        webhook-url: ${{ inputs.discord-nofity-webook-url }}
        message: |
          -----------------------------
          🔃 Application: **${{ inputs.application-name }}**
          🔴 State: **PUBLISH FAILED**
          ⏲️ Timestamp: **${{ env.timestampPublishFailed }}**
          🆔 Run ID: **${{ github.run_id }}**
          👤 Git Actor: **${{ github.actor }}**
          🔗 Run Link: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
    

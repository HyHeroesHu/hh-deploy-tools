name: "Deploy HH.WebPanel App From Dockerhub image"

description: "Deploying HH.WebPanel application from dockerhub, via SSH"

inputs:
  application-name:
    description: "The full name of the application"
  discord-nofity-webook-url:
    description: "The Discord webhook URL for event notification."
    required: true
  dockerhub-pat:
    description: "DockerHub PAT for pushing images."
    required: true
  dockerhub-user:
    description: "DockerHub user for pushing images."
    required: true
  dockerhub-namespace:
    description: "DockerHub namespace for pushing images."
    required: true
  dockerhub-image-name:
    description: "DockerHub image name. At the end a timestamp will be concated."
    required: true
  docker-container-name:
    description: "The name of the docker container, which will host the app."
    required: true
  docker-container-port:
    description: "The public port, where the docker container's app will be reachable."
    required: true
  nginx-site-config-path:
    description: "Absolute path to nginx site config on Linux"
    required: true
  version-timestamp:
    description: "Version timestamp value for docker image identifying."
    required: true
  ssh-host:
    description: "SSH host address"
    required: true
  ssh-user:
    description: "SSH user"
    required: true
  ssh-password:
    description: "SSH password"
    required: true

runs:
  using: "composite"
  steps:
    # Step 1: Get timestamp
    - name: Get Current Timestamp
      id: timestampBuildStarted
      shell: bash
      run: |
        export TZ="Europe/Budapest"
        echo "timestampBuildStarted=$(date +"%Y. %m. %d. %H:%M:%S")" >> $GITHUB_ENV
      
    # Step 2: Discord notification
    - name: Notify Discord (on Start)
      uses: liondadev/discord-action@v2.1.3
      with:
        # The webhook URL
        webhook-url: ${{ inputs.discord-nofity-webook-url }}
        # The message to send
        message: |
          -----------------------------
          🔃 Application: **${{ inputs.application-name }}**
          🟡 State: **PUBLISH STARTED**
          ⏲️ Timestamp: **${{ env.timestampBuildStarted }}**
          👤 Started By: **${{ github.actor }}**
          🆔 Run ID: **${{ github.run_id }}**
          🔗 Run Link: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          
    # Step 3: Deploy to VPS
    - name: Deploy Docker image to VPS via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ inputs.ssh-host }}
        username: ${{ inputs.ssh-user }}
        password: ${{ inputs.ssh-password }}
        script: |
          bash -se <<'HH_DEPLOY_SCRIPT'
          set -Eeuo pipefail
          exec 9>/var/www/.hh-webpanel-deploy.lock
          flock -x 9
          production=/var/www/hh.webpanel
          staging=$(mktemp -d /var/www/.hh.webpanel-stage.XXXXXXXX)
          run_suffix=${staging##*.}
          backup_timestamp=$(TZ=Europe/Budapest date +'%Y-%m-%d_%H-%M-%S')
          backup="/var/www/hh.webpanel-backup-$backup_timestamp-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}-$run_suffix"
          temp_container="temp-${{ inputs.docker-container-name }}-$run_suffix"
          container_created=false
          backup_moved=false
          promoted=false

          cleanup() {
            local status=$?
            trap - EXIT
            set +e
            if [[ "$backup_moved" == true && "$promoted" != true ]]; then
              if ! mv -T -- "$backup" "$production"; then
                echo "Rollback failed; restore $backup to $production manually." >&2
                status=1
              fi
            fi
            if [[ "$container_created" == true ]]; then
              docker rm "$temp_container" || echo "Warning: temporary container cleanup failed: $temp_container" >&2
            fi
            if [[ -d "$staging" ]]; then
              rm -rf -- "$staging" || echo "Warning: staging cleanup failed: $staging" >&2
            fi
            exit "$status"
          }
          trap cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM

          # Login to docker
          echo "${{ inputs.dockerhub-pat }}" | docker login -u "${{ inputs.dockerhub-user }}" --password-stdin

          # Delete all previous images
          docker images --format "{{.Repository}}:{{.Tag}}" | { grep "${{ inputs.docker-image-name }}" || [[ $? -eq 1 ]]; } | while read -r image; do
              echo "Removing image: $image"
              docker rmi -f "$image"
          done

          # Pull new image
          docker pull ${{ inputs.dockerhub-namespace }}/${{ inputs.dockerhub-image-name }}:${{ github.ref_name }}-${{ inputs.version-timestamp }}

          # Delete the existing container
          if docker container inspect '${{ inputs.docker-container-name }}' > /dev/null 2>&1; then
            docker stop '${{ inputs.docker-container-name }}'
            docker rm '${{ inputs.docker-container-name }}'
          fi
          
          # Increase linux kernel's inotify limit
          sysctl fs.inotify.max_user_instances=1024

          # Create a container from the image, WITHOUT starting it
          docker create --name "$temp_container" ${{ inputs.dockerhub-namespace }}/${{ inputs.dockerhub-image-name }}:${{ github.ref_name }}-${{ inputs.version-timestamp }}
          container_created=true

          # Validate the replacement before changing the live directory.
          docker cp "$temp_container:/app/." "$staging"
          if [[ ! -s "$staging/index.html" ]]; then
            echo "Staged WebPanel is missing a nonempty index.html." >&2
            exit 1
          fi
          # mktemp creates mode 0700; nginx must be able to traverse the promoted root.
          chmod 755 "$staging"

          # Retain the previous site for rollback.
          if [[ -e "$production" || -L "$production" ]]; then
            mv -T -- "$production" "$backup"
            backup_moved=true
          fi

          # Rename the new folder to production usage
          mv -T -- "$staging" "$production"
          promoted=true
          if [[ "$backup_moved" == true ]]; then
            echo "Previous WebPanel retained at $backup"
          fi
          HH_DEPLOY_SCRIPT


    ##
    ## Conditional Discord notifications about finish
    ##
    - name: Get Current Timestamp
      id: timestampBuildingSucceeded
      shell: bash
      run: |
        export TZ="Europe/Budapest"
        echo "timestampBuildingSucceeded=$(date +"%Y. %m. %d. %H:%M:%S")" >> $GITHUB_ENV
        
    - name: Notify Discord (on Success)
      uses: liondadev/discord-action@v2.1.3
      with:
        # The webhook URL
        webhook-url: ${{ inputs.discord-nofity-webook-url }}
        # The message to send
        message: |
          -----------------------------
          🔃 Application: **${{ inputs.application-name }}**
          🟢 State: **PUBLISH SUCCEEDED**
          ⏲️ Timestamp: **${{ env.timestampBuildingSucceeded }}**
          🆔 Run ID: **${{ github.run_id }}**
          👤 Git Actor: **${{ github.actor }}**
          🔗 Run Link: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          
    - name: Get Current Timestamp
      id: timestampBuildingFailed
      shell: bash
      if: failure()
      run: |
        export TZ="Europe/Budapest"
        echo "timestampBuildingFailed=$(date +"%Y. %m. %d. %H:%M:%S")" >> $GITHUB_ENV

    - name: Notify Discord (on Failure)
      uses: liondadev/discord-action@v2.1.3
      if: failure()
      with:
        webhook-url: ${{ inputs.discord-nofity-webook-url }}
        message: |
          -----------------------------
          🔃 Application: **${{ inputs.application-name }}**
          🔴 State: **PUBLISH FAILED**
          ⏲️ Timestamp: **${{ env.timestampBuildingFailed }}**
          🆔 Run ID: **${{ github.run_id }}**
          👤 Git Actor: **${{ github.actor }}**
          🔗 Run Link: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          
